version: "3.8"

services:
    app:
        build: .
        container_name: colegio-app
        restart: unless-stopped
        volumes:
            - ./:/var/www
            - vendor:/var/www/vendor
        networks:
            - colegio-net
        depends_on:
            - db
            - redis
        ports:
            - "5173:5173"

    nginx:
        image: nginx:alpine
        container_name: colegio-nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www
            - ./docker-config/nginx:/etc/nginx/conf.d
        networks:
            - colegio-net

    db:
        image: postgres:15-alpine
        container_name: colegio-db
        restart: always
        environment:
            POSTGRES_USER: colegio_aleman_1957
            POSTGRES_PASSWORD: 11021957cA
            POSTGRES_DB: colegio_db
        ports:
            - "5432:5432"
        volumes:
            - colegio_pg_data:/var/lib/postgresql/data
        networks:
            - colegio-net

    redis:
        image: redis:alpine
        container_name: colegio-redis
        restart: always
        networks:
            - colegio-net

networks:
    colegio-net:
        driver: bridge

volumes:
    colegio_pg_data:
    vendor:
